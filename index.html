<style>
:root{--bg:#1a0630;--gold:#ffd9a0;--pink:#ff5fa2;--pur:#8b3df0;--tx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 15% 20%,#ff5fa266,transparent 42%),radial-gradient(circle at 85% 28%,#38bdf855,transparent 42%),radial-gradient(circle at 50% 92%,#ffd16644,transparent 46%),linear-gradient(135deg,#2a0a4a,#5b1a8a 45%,#a3195b 75%,#1a237e);color:var(--tx);font-family:'Nunito','Catamaran',system-ui,-apple-system,sans-serif;overflow:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(135deg,#ff5fa2,#8b3df0,#38bdf8);opacity:.22;animation:hue 14s linear infinite;z-index:0;pointer-events:none}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.s{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:84px 16px 16px;gap:12px;z-index:5}
.s.on{display:flex;animation:in .8s}

.script{font-family:'Great Vibes','Brush Script MT',cursive,serif;margin:0;line-height:1.05;color:var(--gold);text-shadow:0 0 20px #b565f5aa}
.big{background:linear-gradient(90deg,#ffd9a0,#ff8fc2,#7dd3fc,#ffd9a0);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite;text-shadow:none;filter:drop-shadow(0 0 14px #b565f588)}
@keyframes sh{to{background-position:250%}}
.cin{font-family:'Cinzel','Trajan Pro',Georgia,serif;font-weight:800;color:var(--gold);letter-spacing:4px;text-shadow:0 0 14px #ff5fa2aa;margin:0}
.dob{font-family:'Cinzel',Georgia,serif;font-weight:800;color:var(--gold);letter-spacing:4px;text-shadow:0 0 14px #ff5fa2aa;margin:0;font-size:clamp(24px,7.5vw,36px)}
.dsc{font-family:'Nunito','Catamaran',system-ui,sans-serif;font-weight:700}
body.ta .script{font-family:'Catamaran','Noto Sans Tamil',sans-serif;font-weight:800;line-height:1.25;font-size:clamp(28px,8.5vw,52px)!important}

body.ta .cin{letter-spacing:0;font-family:'Catamaran','Noto Sans Tamil',sans-serif}
body.ta #cap{font-family:'Catamaran','Noto Sans Tamil',sans-serif;font-weight:700;font-size:clamp(17px,4.8vw,22px)}
body.ta #wmsg,body.ta #fmsg{line-height:1.7}
button{background:linear-gradient(135deg,#ff5fa2,#8b3df0);color:#fff;border:0;padding:13px 26px;border-radius:30px;font-size:16px;font-weight:800;font-family:inherit;box-shadow:0 6px 22px #ff5fa288;cursor:pointer}
button.sm{padding:9px 16px;font-size:14px}
button.gh{background:#ffffff26;box-shadow:none;backdrop-filter:blur(6px)}
.hide{display:none!important}
canvas{position:fixed;inset:0;pointer-events:none;z-index:50}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
#fl.go{animation:fla .9s ease-out}@keyframes fla{0%{opacity:.95}100%{opacity:0}}
/* language switch */
#lg{position:fixed;top:calc(38px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:70;display:flex;background:#0006;border:1px solid #ffffff55;border-radius:20px;padding:3px;backdrop-filter:blur(8px);cursor:pointer;font-size:13px;font-weight:800;user-select:none}
#lg span{position:relative;z-index:1;width:54px;padding:5px 0;text-align:center}
#lg b{position:absolute;top:3px;bottom:3px;left:3px;width:54px;border-radius:16px;background:linear-gradient(135deg,#ff5fa2,#8b3df0);transition:left .3s}

/* bunting + balloons */
#bun{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:34px;display:flex;justify-content:space-around;z-index:4;pointer-events:none}
#bun::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#ffffff88}
#bun i{width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:28px solid #fff;transform-origin:top center;animation:sw 2.4s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.b,.bl{position:fixed;bottom:-110px;z-index:1;animation:up linear forwards;pointer-events:none}
.b{opacity:.85}
.bl{border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 28%,#ffffffaa,transparent 32%),var(--c);box-shadow:inset -6px -8px 14px #0003}
.bl::after{content:'';position:absolute;left:50%;top:100%;width:1px;height:36px;background:#ffffff99}
.rb{pointer-events:auto;cursor:pointer;z-index:6;animation-timing-function:linear}
@keyframes up{to{transform:translateY(-130vh) rotate(18deg)}}
/* lock */
#lkI{font-size:60px;display:inline-block;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 0 18px #ffd166)}
#lkI.un{animation:unl .8s}@keyframes unl{30%{transform:scale(1.5) rotate(-15deg)}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-12px) rotate(3deg)}}
#dob{display:flex;align-items:center;gap:8px}
#dob i{font-style:normal;font-size:28px;color:var(--gold);opacity:.7}
.db{width:62px;height:74px;border-radius:16px;border:2px solid #ffffff66;background:#ffffff1a;color:#fff;font-family:'Cinzel',serif;font-weight:800;font-size:34px;text-align:center;outline:none;box-shadow:0 0 18px #ff5fa244;transition:.25s;padding:0;box-sizing:border-box}
.db.y{width:116px}
.db:focus{border-color:var(--gold);box-shadow:0 0 28px #ffd16699;transform:scale(1.06)}
.db::placeholder{color:#ffffff55;font-size:16px}
#dob.okd .db{border-color:#4ade80;box-shadow:0 0 28px #4ade8099;color:#bbf7d0}

#le{min-height:36px;font-size:14px;font-weight:700;max-width:330px}
#sl{position:relative;width:min(320px,86vw);height:64px;border-radius:40px;background:#ffffff22;border:1px solid #ffffff55;backdrop-filter:blur(6px);touch-action:none;user-select:none;transition:opacity .4s}

#slt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 52px 0 64px;font-size:14px;font-weight:800;pointer-events:none;background:linear-gradient(90deg,#fff8,#fff,#fff8);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.5s linear infinite}
#sh{position:absolute;left:4px;top:4px;width:56px;height:56px;border-radius:50%;background:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;z-index:3;box-shadow:0 4px 14px #0006;transition:left .3s,opacity .4s}

#se{position:absolute;right:10px;top:50%;margin-top:-20px;font-size:36px;z-index:1}

.gb{position:absolute;bottom:0;left:0;width:130px;height:90px;border-radius:8px;background:linear-gradient(135deg,#ff5fa2,#8b3df0)}

.lid{position:absolute;top:0;left:-8px;width:146px;height:42px;border-radius:8px;background:linear-gradient(135deg,#ff7ab8,#a855f7);transition:transform .8s cubic-bezier(.2,.8,.3,1),opacity .8s;z-index:2}
.bow{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:42px;z-index:3}
.open .lid{transform:translateY(-170px) rotate(-30deg);opacity:0}
.open #gift{animation:shk .4s}@keyframes shk{25%{transform:scale(1.15) rotate(-6deg)}50%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1)}}
.rays{position:absolute;width:640px;height:640px;left:50%;top:50%;margin:-320px 0 0 -320px;border-radius:50%;background:repeating-conic-gradient(#ffd166aa 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 68%);mask:radial-gradient(circle,#000 0,transparent 68%);opacity:0;transform:scale(.2);pointer-events:none}
.open .rays{animation:ray 1.7s ease-out forwards}

.open~.gt{opacity:0;transition:opacity .4s}
.crown{font-size:56px;animation:cw 2s ease-in-out infinite alternate;filter:drop-shadow(0 0 16px #ffd166)}
@keyframes cw{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-8px) rotate(6deg)}}

#ck{max-width:84vw;overflow:visible;filter:drop-shadow(0 12px 24px #0006)}
.fm{transform-box:fill-box;transform-origin:50% 100%;animation:fk .22s infinite alternate}

.sm{transform-box:fill-box;transform-origin:center;animation:smk 1.9s ease-out forwards;opacity:0}

#age{font-size:clamp(110px,36vw,170px);font-weight:800;color:var(--gold);text-shadow:0 0 30px #ff5fa2;line-height:1;font-family:'Cinzel',Georgia,serif;min-width:2ch}

#yr{display:inline-block}

#cr{font-size:64px;opacity:0;height:70px}
#cr.drop{animation:dr 1s cubic-bezier(.3,1.5,.5,1) forwards}@keyframes dr{0%{opacity:0;transform:translateY(-120px) scale(.5) rotate(-30deg)}100%{opacity:1;transform:none}}
.ring{position:absolute;left:50%;top:48%;width:120px;height:120px;margin:-60px;border:4px solid #ffd166;border-radius:50%;opacity:0;pointer-events:none}
.go .ring{animation:rg 1.5s ease-out}.go .ring+.ring{animation-delay:.25s}
@keyframes rg{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(7)}}
/* gallery */
#s4{padding:0;justify-content:flex-end;gap:0;overflow:hidden}
#bgi{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(28px) brightness(.5) saturate(1.3);z-index:0}
#bgi.bf{animation:bf .9s}@keyframes bf{from{opacity:0}to{opacity:1}}
#stage{position:relative;z-index:1;flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:84px 18px 0;box-sizing:border-box;min-height:0}
#mi{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 0 0 2px #ffffff44,0 14px 50px #000c,0 0 50px #ff5fa266;object-fit:contain}
.v0{animation:a0 .9s cubic-bezier(.2,.9,.3,1) both,zz 6s linear .9s forwards}
.v1{animation:a1 .9s cubic-bezier(.2,.9,.3,1) both,zz 6s linear .9s forwards}
.v2{animation:a2 .9s cubic-bezier(.2,.9,.3,1) both,zz 6s linear .9s forwards}
.v3{animation:a3 .9s cubic-bezier(.2,.9,.3,1) both,zz 6s linear .9s forwards}
.v4{animation:a4 1s cubic-bezier(.3,1.4,.5,1) both,zz 6s linear 1s forwards}
.v5{animation:a5 1s ease-out both,zz 6s linear 1s forwards}

@keyframes a0{from{opacity:0;transform:scale(.4) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes a1{from{opacity:0;transform:translateX(120%) rotate(8deg)}to{opacity:1;transform:none}}
@keyframes a2{from{opacity:0;transform:translateX(-120%) rotate(-8deg)}to{opacity:1;transform:none}}

@keyframes a4{from{opacity:0;transform:translateY(-130%)}to{opacity:1;transform:none}}
@keyframes a5{from{opacity:0;filter:blur(26px);transform:scale(1.25)}to{opacity:1;filter:none;transform:none}}
#bar{position:relative;z-index:2;width:100%;padding:10px 16px 16px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(transparent,#000a 40%)}
#cap{font-family:'Great Vibes','Brush Script MT',cursive,serif;font-size:clamp(26px,7.5vw,38px);color:var(--gold);min-height:44px;line-height:1.1}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}

#cnt{position:absolute;top:calc(48px + env(safe-area-inset-top,0px));left:16px;z-index:3;font-size:13px;opacity:.9;letter-spacing:2px}

#wcard{width:min(400px,88vw);min-height:250px;padding:26px 22px;box-sizing:border-box;border-radius:22px;background:linear-gradient(145deg,#ffffff26,#ffffff0d);border:1px solid #ffffff55;backdrop-filter:blur(8px);box-shadow:0 0 40px #ff5fa244;display:flex;align-items:center;justify-content:center}
#wmsg{font-size:clamp(18px,5vw,22px);line-height:1.6;white-space:pre-wrap}
#wdots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffffff44;margin:0 4px}#wdots i.on{background:var(--gold)}
#fmsg{font-size:clamp(19px,5.2vw,23px);line-height:1.6;max-width:430px;white-space:pre-wrap;min-height:150px}
#cb{position:fixed;right:5px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:10px;letter-spacing:2px;opacity:.2;pointer-events:none}

const BC=['#ff5fa2','#ffd166','#38bdf8','#a855f7','#2dd4bf','#ff9f43','#f43f5e'];
(()=>{const b=$('bun');for(let i=0;i<14;i++){const f=document.createElement('i');f.style.borderTopColor=BC[i%7];f.style.animationDelay=(i%5)*.3+'s';b.appendChild(f)}})();
function balloon(){const d=document.createElement('div'),w=34+Math.random()*24;d.className='bl';d.style.setProperty('--c',BC[Math.floor(Math.random()*7)]);d.style.left=Math.random()*92+'vw';d.style.width=w+'px';d.style.height=w*1.25+'px';d.style.animationDuration=(8+Math.random()*6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),14500)}
function float(e){const d=document.createElement('div');d.className='b';d.textContent=e;d.style.left=Math.random()*92+'vw';d.style.fontSize=(20+Math.random()*24)+'px';d.style.animationDuration=(7+Math.random()*6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),13500)}
const FE=['✨','🌸','🦋','⭐','❤️','🩷','💗','❤️'];
setInterval(()=>Math.random()<.5?balloon():float(FE[Math.floor(Math.random()*FE.length)]),800);
function show(n){document.querySelectorAll('.s').forEach(e=>e.classList.remove('on'));$('s'+n).classList.add('on');T.forEach(clearTimeout);T=[];clearInterval(fw);clearInterval(hr);if(n!=='R')document.querySelectorAll('.rb').forEach(e=>e.remove())}
const later=(f,ms)=>T.push(setTimeout(f,ms));
function fireworks(ms){clearInterval(fw);fw=setInterval(()=>firework(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.4)),ms)}
function typer(el,txt,sp,done){el.textContent='';const a=(window.Intl&&Intl.Segmenter)?[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(txt)].map(s=>s.segment):Array.from(txt);let i=0;(function k(){if(i<a.length){el.textContent+=a[i++];tick();T.push(setTimeout(k,sp))}else if(done)done()})()}
/* L: date of birth gate */
const dd=$('dd'),mm=$('mm'),yy=$('yy');
[dd,mm,yy].forEach((el,i,arr)=>{el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'');if(el.value)tone(600+i*160+Math.random()*100,.07,'triangle',.1);if(el.value.length>=el.maxLength&&arr[i+1])arr[i+1].focus();chk()});el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&arr[i-1])arr[i-1].focus()})});
function chk(){if(dobOk||yy.value.length<4||!dd.value||!mm.value)return;if(+dd.value===1&&+mm.value===12&&+yy.value===2006)unlock();else wrong()}
function unlock(){dobOk=true;[dd,mm,yy].forEach(e=>{e.readOnly=true;e.blur()});$('dob').classList.add('okd');$('lkI').textContent='🔓';$('lkI').classList.add('un');ding();fan();tone(200,.1,'square',.12);burst(innerWidth/2,innerHeight*.35,120);setI('le','dobok');$('le').style.color='#bbf7d0';$('sl').classList.remove('dis');setI('slt','slide')}
function wrong(){bad++;const d=$('dob');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');tone(150,.25,'sawtooth',.12);tone(120,.3,'sawtooth',.12,.15);setI('le',bad>=2?'dobbad2':'dobbad');$('le').style.color='#fda4af';setTimeout(()=>{[dd,mm,yy].forEach(e=>e.value='');d.classList.remove('shake');dd.focus()},900)}
/* L: slide the cake piece to join the cake */
let sdr=false,sx0=0,smax=0,curX=0,lastStep=0;const sh=$('sh');
function setSl(x){curX=x;sh.style.left=(4+x)+'px';$('slf').style.width=(x+60)+'px';$('slt').style.opacity=Math.max(0,1-x/smax*1.5);const st=Math.floor(x/smax*10);if(st!==lastStep){lastStep=st;tone(500+st*70,.05,'triangle',.08)}}
sh.addEventListener('pointerdown',e=>{if(!dobOk||slDone)return;sdr=true;sx0=e.clientX-curX;smax=$('sl').clientWidth-64;sh.style.transition='none';$('slf').style.transition='none';sh.setPointerCapture(e.pointerId)});
sh.addEventListener('pointermove',e=>{if(!sdr)return;setSl(Math.max(0,Math.min(smax,e.clientX-sx0)))});
const endDrag=()=>{if(!sdr)return;sdr=false;sh.style.transition='';$('slf').style.transition='';if(curX>smax*.88)joinCake();else setSl(0)};
sh.addEventListener('pointerup',endDrag);sh.addEventListener('pointercancel',endDrag);
function joinCake(){slDone=true;setSl(smax);sh.style.opacity=0;$('se').classList.add('join');tone(880,.12,'triangle',.2);tone(1320,.25,'sine',.15,.08);pop();fan();burst(innerWidth/2,innerHeight*.6,120);later(startReady,1000)}
/* R: get ready + balloons that burst */
function mkRb(){const d=document.createElement('div'),w=62+Math.random()*34;d.className='bl rb';d.style.setProperty('--c',BC[Math.floor(Math.random()*7)]);d.style.left=(Math.random()*88)+'vw';d.style.width=w+'px';d.style.height=w*1.25+'px';d.style.animationDuration=(9+Math.random()*5)+'s';d.style.animationDelay=(-Math.random()*6)+'s';d.onpointerdown=()=>popB(d);document.body.appendChild(d)}
function popB(d){if(!d.isConnected)return;const r=d.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,26);pop();d.remove()}
function startReady(){show('R');for(let i=0;i<16;i++)mkRb();const cnt=n=>{const r=$('rn');r.textContent=n;r.classList.remove('cp');void r.offsetWidth;r.classList.add('cp');tone(420+(4-n)*180,.15,'square',.07)};cnt(3);later(()=>cnt(2),1000);later(()=>cnt(1),2000);
 later(()=>{$('rn').textContent='🎉';$('rn').classList.remove('cp');void $('rn').offsetWidth;$('rn').classList.add('cp');fan();document.querySelectorAll('.rb').forEach((b,i)=>setTimeout(()=>popB(b),i*90));later(()=>burst(innerWidth/2,innerHeight/2,160),500)},3000);later(()=>show(0),4800)}
/* 0 gift */
$('gw').onclick=()=>{if(opened)return;opened=true;ac();$('gw').classList.add('open');pop();noise(.5,.2);fan();burst(innerWidth/2,innerHeight/2,130);later(()=>{burst(0,innerHeight*.7,90);burst(innerWidth,innerHeight*.7,90);pop();ding()},400);later(()=>{show(1);fan();burst();startSong();fireworks(900);later(()=>$('n1').classList.remove('hide'),5000)},1800)};
/* 2 cake: tap anywhere */
function blow(){if(blown)return;blown=true;ac();$('s2').classList.add('out');noise(.8,.25);const g=$('smk');[118,134,150,166,182].forEach(x=>{for(let k=0;k<3;k++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x+(Math.random()*6-3));c.setAttribute('cy',44);c.setAttribute('r',4);c.setAttribute('fill','#fff');c.setAttribute('class','sm');c.style.animationDelay=(k*.25+Math.random()*.2)+'s';g.appendChild(c)}});
 later(()=>{pop();fan();burst();burst(innerWidth/2,innerHeight/2,110);setI('ct','ct2');setI('ch','ch2');$('n2').classList.remove('hide')},500)}
$('s2').onclick=e=>{if(e.target.id!=='n2')blow()};
$('n1').onclick=()=>{ac();pop();show(2);blown=false;$('s2').classList.remove('out');$('smk').innerHTML='';setI('ct','ct1');setI('ch','ch1');$('n2').classList.add('hide')};
/* 3 age reveal: year rolls down while age counts up, then level-up blast */
$('n2').onclick=()=>{show(3);const A=$('age'),Y=$('yr'),s3=$('s3');let n=0;A.textContent='0';A.classList.remove('pop');Y.textContent='2006';Y.className='';$('cr').classList.remove('drop');$('ag2').style.opacity=0;$('n3').classList.add('hide');s3.classList.remove('go');setI('bl','bo');$('al').textContent='';$('al').removeAttribute('data-i');
 const step=()=>{n++;A.textContent=n;Y.textContent=2006+n;Y.className='';void Y.offsetWidth;Y.className='yd';tone(260+n*38,.06,'square',.04);if(n<19){T.push(setTimeout(step,n<10?80:n<15?130:220))}else{
  later(()=>{tone(110,.25,'sine',.2);tone(110,.25,'sine',.2,.3)},300);later(()=>sweep(1.1),700);
  later(()=>{$('fl').classList.remove('go');void $('fl').offsetWidth;$('fl').classList.add('go');s3.classList.add('go');A.textContent='20';A.classList.add('pop');Y.textContent='2026';Y.className='yf';$('cr').classList.add('drop');setI('bl','now');setI('al','al2');ding();fan();burst(innerWidth/2,innerHeight*.4,170);firework(innerWidth*.2,innerHeight*.3);firework(innerWidth*.8,innerHeight*.3)},1900);
  later(()=>{burst(innerWidth/2,innerHeight*.45,100);firework(innerWidth*.5,innerHeight*.2)},2700);
  later(()=>$('ag2').style.opacity=1,3200);later(()=>$('n3').classList.remove('hide'),5000)}};
 later(()=>{setI('bl','yrs');setI('al','al1');step()},1200)};
/* 4 gallery */
let gi=0,auto=true;
function ph(i){gi=(i+IM.length)%IM.length;const m=$('mi'),b=$('bgi');m.className='';void m.offsetWidth;m.src=IM[gi];m.className='v'+(gi%6);b.classList.remove('bf');void b.offsetWidth;b.src=IM[gi];b.classList.add('bf');$('cap').textContent=CAP[lang][gi];$('cnt').textContent=(gi+1)+' / '+IM.length;$('wb').classList.toggle('hide',gi<IM.length-1);whoosh();tone(1500,.08,'sine',.06);burst(innerWidth/2,innerHeight*.42,20)}
function sched(){clearTimeout(at);if(auto&&gi<IM.length-1)at=setTimeout(()=>{ph(gi+1);sched()},5200)}
$('n3').onclick=()=>{show(4);stopSong();bgmOn();auto=true;$('ap').textContent='⏸';ph(0);sched();burst(innerWidth/2,innerHeight/2,60)};
$('nx').onclick=()=>{if(gi>=IM.length-1){toWishes();return}ph(gi+1);sched()};
$('pv').onclick=()=>{ph(gi-1);sched()};
$('ap').onclick=()=>{auto=!auto;$('ap').textContent=auto?'⏸':'▶';sched()};
$('snd').onclick=()=>{const a=$('bgm');a.muted=!a.muted;$('snd').textContent=a.muted?'🔇':'🔊'};
let sx=0;$('s4').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('s4').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50){ph(gi+(d<0?1:-1));sched()}});
/* 5 wishes */
let wi=0;
function wish(){const W=WS[lang];$('wn').classList.add('hide');$('wdots').innerHTML=W.map((_,i)=>`<i class="${i<=wi?'on':''}"></i>`).join('');typer($('wmsg'),W[wi],34,()=>{burst(innerWidth/2,innerHeight*.3,40);later(()=>{setI('wn',wi<W.length-1?'wn1':'wn2');$('wn').classList.remove('hide')},300)})}
function toWishes(){clearTimeout(at);show(5);wi=0;fan();burst();later(wish,700)}
$('wb').onclick=toWishes;
$('wn').onclick=()=>{pop();if(wi<WS[lang].length-1){wi++;wish()}else finale()};
/* 6 final */
function finalType(){$('rp').classList.add('hide');typer($('fmsg'),FIN[lang],46,()=>{fan();burst();later(()=>$('rp').classList.remove('hide'),1000)})}
function finale(){show(6);fan();ding();burst();burst(innerWidth*.2,innerHeight*.5,90);burst(innerWidth*.8,innerHeight*.5,90);fireworks(1000);hr=setInterval(()=>float(['❤️','🩷','💗'][Math.floor(Math.random()*3)]),420);$('s6').scrollTop=0;later(finalType,900)}
$('rp').onclick=()=>{T.forEach(clearTimeout);clearInterval(fw);clearInterval(hr);clearTimeout(at);const a=$('bgm');a.pause();a.currentTime=0;stopSong();opened=false;$('gw').classList.remove('open');show(0)};
applyLang();
</script></body></html>
